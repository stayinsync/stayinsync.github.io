<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Spotify</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#s{position:fixed;inset:0;background:#1db954;opacity:0;transition:opacity .6s cubic-bezier(.22,1,.36,1);pointer-events:none}
#s.on{opacity:1}
#s.err{background:#e5484d;pointer-events:auto;cursor:pointer}
</style>
</head>
<body>
<div id="s"></div>
<script>
(()=>{
const CLIENT_ID="a287508bcb8a471b93ffca010568b122";
const REDIRECT="https://stayinsync.github.io/";
const SCOPES="user-read-playback-state user-read-currently-playing user-modify-playback-state streaming";
const AUTH="https://accounts.spotify.com/authorize";
const TOKEN="https://accounts.spotify.com/api/token";
const el=document.getElementById("s");

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rand=n=>b64(crypto.getRandomValues(new Uint8Array(n)));

const show=(err)=>{
  el.classList.toggle("err",!!err);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
};

const save=d=>{
  const t={
    access:d.access_token,
    refresh:d.refresh_token||(JSON.parse(localStorage.getItem("sp_tok")||"{}").refresh)||null,
    exp:Date.now()+d.expires_in*1000
  };
  localStorage.setItem("sp_tok",JSON.stringify(t));
};

const post=body=>fetch(TOKEN,{
  method:"POST",
  headers:{"Content-Type":"application/x-www-form-urlencoded"},
  body:new URLSearchParams(body)
}).then(r=>r.ok?r.json():Promise.reject());

const begin=async()=>{
  const verifier=rand(64);
  const state=rand(16);
  const challenge=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  sessionStorage.setItem("sp_v",verifier);
  sessionStorage.setItem("sp_s",state);
  const q=new URLSearchParams({
    client_id:CLIENT_ID,
    response_type:"code",
    redirect_uri:REDIRECT,
    scope:SCOPES,
    state:state,
    code_challenge_method:"S256",
    code_challenge:challenge
  });
  location.replace(AUTH+"?"+q);
};

const fail=()=>{
  sessionStorage.removeItem("sp_v");
  sessionStorage.removeItem("sp_s");
  el.onclick=()=>{el.onclick=null;el.classList.remove("on","err");begin()};
  show(true);
};

const callback=async p=>{
  const code=p.get("code");
  const state=p.get("state");
  const v=sessionStorage.getItem("sp_v");
  const s=sessionStorage.getItem("sp_s");
  history.replaceState(null,"",REDIRECT);
  if(!code||!v||!s||state!==s)return fail();
  try{
    const d=await post({
      client_id:CLIENT_ID,
      grant_type:"authorization_code",
      code:code,
      redirect_uri:REDIRECT,
      code_verifier:v
    });
    sessionStorage.removeItem("sp_v");
    sessionStorage.removeItem("sp_s");
    save(d);
    show(false);
  }catch(e){
    fail();
  }
};

const resume=async()=>{
  let t;
  try{t=JSON.parse(localStorage.getItem("sp_tok")||"null")}catch(e){t=null}
  if(t&&t.access&&t.exp>Date.now()+30000)return show(false);
  if(t&&t.refresh){
    try{
      const d=await post({grant_type:"refresh_token",refresh_token:t.refresh,client_id:CLIENT_ID});
      save(d);
      return show(false);
    }catch(e){
      localStorage.removeItem("sp_tok");
    }
  }
  begin();
};

const p=new URLSearchParams(location.search);
if(p.has("code")||p.has("error"))callback(p);
else resume();
})();
</script>
</body>
</html>
