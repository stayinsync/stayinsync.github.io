<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>&#8203;</title>
<link rel="icon" href="data:,">
<script>try{if(/[?&]code=/.test(location.search))document.documentElement.className='w'}catch(e){}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#000;transition:background-color 1.2s cubic-bezier(.65,0,.35,1)}
html.w{background:#fff}
body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.stage{--d:clamp(150px,25vmin,260px);--e:cubic-bezier(.16,1,.3,1);position:fixed;inset:0;display:none;place-items:center;overflow:hidden;background:radial-gradient(90% 75% at 50% 46%,#151515 0,#050505 62%,#000 100%)}
.stage.live{display:grid}
.glow{position:absolute;inset:0;margin:auto;width:92vmin;height:92vmin;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,255,255,.2),rgba(255,255,255,.07) 45%,rgba(255,255,255,0));animation:bloom 3s var(--e) .2s backwards,breathe 10s ease-in-out 3.2s infinite alternate}
.glow::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,0) 0 6%,rgba(255,255,255,.17) 20%,rgba(255,255,255,0) 36% 54%,rgba(255,255,255,.12) 70%,rgba(255,255,255,0) 86%);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent);mask:radial-gradient(closest-side,#000 20%,transparent);animation:spin 26s linear infinite}
.ring{position:absolute;inset:0;margin:auto;width:var(--d);height:var(--d);border-radius:50%;border:1.5px solid rgba(255,255,255,.75);opacity:0;pointer-events:none}
.tilt{position:relative;width:var(--d);height:var(--d);transition:scale .6s var(--e)}
.orb{position:relative;display:block;width:100%;height:100%;border:0;border-radius:50%;background:none;color:inherit;font:inherit;outline:none;appearance:none;-webkit-appearance:none;pointer-events:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;animation:rise 2.6s var(--e) .7s backwards}
.on .orb{pointer-events:auto;cursor:pointer}
.orb:focus-visible{outline:1px solid rgba(255,255,255,.65);outline-offset:12px}
@media (hover:hover){.on .tilt:hover{scale:1.06}}
.on .tilt:active{scale:.955;transition-duration:.25s}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(125% 125% at 26% 16%,rgba(255,255,255,.36),rgba(255,255,255,.08) 40%,rgba(255,255,255,.03) 64%,rgba(255,255,255,.14)),linear-gradient(165deg,rgba(255,255,255,.14),rgba(0,0,0,.5));-webkit-backdrop-filter:blur(18px) brightness(1.18);backdrop-filter:blur(18px) brightness(1.18);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 3px rgba(255,255,255,.4),inset 0 24px 40px -16px rgba(255,255,255,.3),inset 0 -28px 42px -18px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.16),0 34px 70px -20px rgba(0,0,0,.95);animation:fade 2.4s ease .7s backwards}
.disc::before{content:"";position:absolute;inset:7%;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,0) 46%,rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.07)}
.disc::after{content:"";position:absolute;left:16%;right:16%;top:3%;height:36%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));opacity:.4;transition:opacity .8s var(--e)}
@media (hover:hover){.on .orb:hover .disc::after{opacity:.7}}
.glyph{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.65)) drop-shadow(0 0 9px rgba(255,255,255,.18))}
.a{fill:none;stroke:url(#c);stroke-linecap:round;stroke-dasharray:1 1.1;animation:draw 1.2s cubic-bezier(.65,0,.35,1) calc(1.4s + var(--i)*.2s) backwards}
.rim{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(255,255,255,0),rgba(255,255,255,.95) 11%,rgba(255,255,255,0) 26%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.9) 61%,rgba(255,255,255,0) 76%,rgba(255,255,255,.14) 92%,rgba(255,255,255,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:fade 2s ease 1.1s backwards,spin 18s linear infinite}
.shine{position:absolute;inset:0;border-radius:50%;clip-path:circle(50%);mix-blend-mode:screen;pointer-events:none}
.sheen{position:absolute;top:-25%;left:0;width:58%;height:150%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.1) 28%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.1) 72%,rgba(255,255,255,0));transform:translateX(-170%) skewX(-20deg);animation:sweep 9s var(--e) 2.9s infinite}
.iris{position:absolute;inset:0;background:#fff;clip-path:circle(0% at 50% 50%);pointer-events:none}
.go .orb{animation:ignite 1.9s linear forwards}
.go .glow{animation:surge 1.9s var(--e) forwards}
.go .glyph{animation:lit 1.9s ease forwards}
.go .a{animation:wave .9s cubic-bezier(.34,1.56,.64,1) calc((2 - var(--i))*.12s + .2s) both}
.go .ring{animation:pulse 1.5s var(--e) .3s forwards}
.go .r2{animation-delay:.46s}
.go .iris{animation:iris 1.9s linear forwards}
@keyframes rise{from{transform:translateY(22px) scale(.82)}}
@keyframes fade{from{opacity:0}}
@keyframes bloom{from{opacity:0;transform:scale(1.35)}}
@keyframes breathe{from{opacity:1;transform:scale(1)}to{opacity:.8;transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:1.05}}
@keyframes sweep{0%{transform:translateX(-170%) skewX(-20deg)}22%,100%{transform:translateX(340%) skewX(-20deg)}}
@keyframes wave{40%{transform:translateY(-3.6px)}}
@keyframes lit{35%{filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.65)) drop-shadow(0 0 26px rgba(255,255,255,.95))}}
@keyframes ignite{
0%{transform:scale(1);animation-timing-function:cubic-bezier(.4,0,.6,1)}
10%{transform:scale(.9);animation-timing-function:cubic-bezier(.2,1.5,.4,1)}
38%{transform:scale(1.1);animation-timing-function:ease-in-out}
56%{transform:scale(1.06);animation-timing-function:cubic-bezier(.7,0,.9,.4)}
100%{transform:scale(2.2)}
}
@keyframes surge{from{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1.5)}to{opacity:1;transform:scale(2.4)}}
@keyframes pulse{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(4.2)}}
@keyframes iris{
0%,50%{clip-path:circle(0% at 50% 50%);animation-timing-function:cubic-bezier(.7,0,.2,1)}
100%{clip-path:circle(80% at 50% 50%)}
}
@media (prefers-reduced-motion:reduce){
.rim,.glow::before,.sheen{animation:none}
.glow{animation:bloom 3s var(--e) .2s backwards}
}
</style>
</head>
<body>
<main class="stage" id="s">
<div class="glow"></div>
<i class="ring"></i>
<i class="ring r2"></i>
<div class="tilt" id="t">
<button class="orb" id="o" type="button" aria-label="Connect to Spotify">
<span class="disc"></span>
<svg class="glyph" viewBox="0 0 100 100" aria-hidden="true">
<defs>
<linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset=".42" stop-color="#d9d9d9"/>
<stop offset=".5" stop-color="#4a4a4a"/>
<stop offset=".58" stop-color="#e8e8e8"/>
<stop offset="1" stop-color="#ffffff"/>
</linearGradient>
</defs>
<path class="a" style="--i:0" pathLength="1" stroke-width="7" d="M23 37C41 29.5 63 30.5 78 41"/>
<path class="a" style="--i:1" pathLength="1" stroke-width="5.6" d="M26.5 51.5C41 46.5 59 47.5 73 55"/>
<path class="a" style="--i:2" pathLength="1" stroke-width="4.2" d="M30 64.5C42 60.5 55 61.5 67 67"/>
</svg>
<span class="rim"></span>
<span class="shine"><i class="sheen"></i></span>
</button>
</div>
<i class="iris"></i>
</main>
<script>
(()=>{
'use strict';
const CID='a287508bcb8a471b93ffca010568b122';
const RU='https://stayinsync.github.io/';
const SC='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-currently-playing';
const $=q=>document.querySelector(q);
const root=document.documentElement;
const stage=$('#s'),tilt=$('#t'),orb=$('#o'),iris=$('.iris'),sheen=$('.sheen'),meta=$('meta[name=theme-color]');
const kv={
get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},
del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64(crypto.getRandomValues(new Uint8Array(n)));
const paint=white=>{root.classList.toggle('w',white);meta.content=white?'#ffffff':'#000000'};
const token=async params=>{
const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...params})});
if(!res.ok)throw new Error('token');
const data=await res.json();
const prev=JSON.parse(kv.get('sy.t')||'{}');
kv.set('sy.t',JSON.stringify({a:data.access_token,r:data.refresh_token||prev.r,e:Date.now()+data.expires_in*1000-30000}));
return data.access_token;
};
const session=async()=>{
const saved=JSON.parse(kv.get('sy.t')||'null');
if(!saved||!saved.r)return null;
return saved.e>Date.now()?saved.a:token({grant_type:'refresh_token',refresh_token:saved.r});
};
const authorize=async()=>{
const verifier=rnd(64),state=rnd(16);
const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
if(!kv.set('sy.v',verifier)||!kv.set('sy.s',state))throw new Error('storage');
return'https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RU,scope:SC,state,code_challenge_method:'S256',code_challenge:b64(digest)});
};
const land=()=>{paint(true);stage.remove()};
const intro=()=>{
paint(false);
stage.classList.add('live');
let busy=false,sweep=null,frame=0,tx=0,ty=0,cx=0,cy=0;
const ready=()=>stage.classList.add('on');
$('.a:last-of-type').addEventListener('animationend',ready,{once:true});
setTimeout(ready,4800);
const step=()=>{
cx+=(tx-cx)*.085;
cy+=(ty-cy)*.085;
tilt.style.transform=`perspective(900px) rotateX(${(-cy*8).toFixed(2)}deg) rotateY(${(cx*8).toFixed(2)}deg)`;
frame=Math.abs(tx-cx)+Math.abs(ty-cy)>.001?requestAnimationFrame(step):0;
};
const aim=(x,y)=>{tx=x;ty=y;if(!frame)frame=requestAnimationFrame(step)};
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!busy)aim(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)},{passive:true});
root.addEventListener('mouseleave',()=>aim(0,0));
orb.addEventListener('pointerenter',e=>{
if(e.pointerType!=='mouse'||busy||(sweep&&sweep.playState==='running'))return;
sweep=sheen.animate([{transform:'translateX(-170%) skewX(-20deg)'},{transform:'translateX(340%) skewX(-20deg)'}],{duration:1200,easing:'cubic-bezier(.22,1,.36,1)'});
});
orb.addEventListener('click',async()=>{
if(busy)return;
busy=true;
aim(0,0);
stage.classList.add('go');
const link=authorize().catch(()=>null);
const done=new Promise(resolve=>{iris.addEventListener('animationend',resolve,{once:true});setTimeout(resolve,2800)});
const[,url]=await Promise.all([done,link]);
if(url)location.assign(url);
else{stage.classList.remove('go');busy=false}
});
addEventListener('pageshow',e=>{if(e.persisted){stage.classList.remove('go');busy=false}});
};
const boot=async()=>{
const q=new URLSearchParams(location.search);
const code=q.get('code'),state=q.get('state');
if(code||q.has('error'))history.replaceState(null,'',location.pathname);
try{
if(code){
const verifier=kv.get('sy.v'),expected=kv.get('sy.s');
kv.del('sy.v');
kv.del('sy.s');
if(!verifier||state!==expected)throw new Error('state');
await token({grant_type:'authorization_code',code,redirect_uri:RU,code_verifier:verifier});
return land();
}
if(await session())return land();
}catch(e){}
intro();
};
boot();
})();
</script>
</body>
</html>
